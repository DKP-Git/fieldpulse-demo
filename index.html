<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>img{max-width:100%}body{margin:0}</style>
<meta charset="utf-8">
<title>FieldPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: FieldPulse shell — deep-green sidebar with grouped nav, top bar with breadcrumb + primary action, white 11px cards on pale paper */
:root{
  --bg:#F6F8F7; --surface:#FFFFFF; --sunk:#EEF2F0; --ink:#10201C; --muted:#6F7D78; --line:#E5EBE8;
  --tape:#0C6B50; --tape-soft:#E3F3EC; --on-tape:#FFFFFF;
  --ok:#0C6B50; --ok-soft:#E3F3EC; --warn:#B87818; --warn-soft:#FCF1DF; --crit:#B54F42; --crit-soft:#FAEBE8; --bar-crit:#D65F51; --bar-warn:#E7A84C;
  --blue:#3F78D6; --blue-soft:#E8F0FC; --violet:#6C57C9; --violet-soft:#EEEBFA;
  --star:#E0A100; --side:#081511; --side-ink:#DBE7E2; --side-muted:#9FB2AA; --side-active:#17392D; --side-line:#1B2E27; --mint:#9FE0C4;
  --f-display:Manrope, "Helvetica Neue", Arial, sans-serif;
  --f-body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"DM Mono", ui-monospace, Menlo, monospace;
  --r:11px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1411; --surface:#121E1A; --sunk:#182722; --ink:#E4EEEA; --muted:#93A6A0; --line:#22342E;
  --tape:#3FBF8E; --tape-soft:#14352A; --on-tape:#06130E;
  --ok:#4CC99A; --ok-soft:#123326; --warn:#E7A84C; --warn-soft:#33270F; --crit:#EE7F72; --crit-soft:#3A1A16; --bar-crit:#E06A5C; --bar-warn:#E7A84C;
  --blue:#7BA7F0; --blue-soft:#172A47; --violet:#A796EE; --violet-soft:#251F42;
  --star:#F2C14B; --side:#050D0A; --side-ink:#DBE7E2; --side-muted:#8BA097; --side-active:#163428; --side-line:#16261F; --mint:#9FE0C4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1411; --surface:#121E1A; --sunk:#182722; --ink:#E4EEEA; --muted:#93A6A0; --line:#22342E;
  --tape:#3FBF8E; --tape-soft:#14352A; --on-tape:#06130E;
  --ok:#4CC99A; --ok-soft:#123326; --warn:#E7A84C; --warn-soft:#33270F; --crit:#EE7F72; --crit-soft:#3A1A16; --bar-crit:#E06A5C; --bar-warn:#E7A84C;
  --blue:#7BA7F0; --blue-soft:#172A47; --violet:#A796EE; --violet-soft:#251F42;
  --star:#F2C14B; --side:#050D0A; --side-ink:#DBE7E2; --side-muted:#8BA097; --side-active:#163428; --side-line:#16261F; --mint:#9FE0C4; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.85rem;font-weight:800;line-height:1.15;letter-spacing:-.02em}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 6px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:#17392D;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:8px 7px;flex:none}
.brand-mark i{width:3px;border-radius:2px;background:var(--mint)}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.2rem;color:#fff;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:3px}
.nav .grp{font-size:.72rem;color:var(--side-muted);letter-spacing:.05em;padding:14px 10px 6px;opacity:.85}
.nav .grp:first-child{padding-top:0}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:8px;color:var(--side-muted);text-decoration:none;font-weight:500;font-size:.9rem}
.nav a:hover{background:rgba(255,255,255,.05);color:var(--side-ink)}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:600}
.nav .ico{width:18px;text-align:center;font-size:.9rem;color:inherit}
.nav .badge{margin-left:auto;font-size:.72rem;font-weight:600;background:#1F3A30;color:var(--side-ink);padding:1px 7px;border-radius:99px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.live{border:1px solid var(--side-line);background:#0E1F19;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;font-size:.8rem}
.live .ld{width:8px;height:8px;border-radius:50%;background:#4CD28F;box-shadow:0 0 0 3px rgba(76,210,143,.18);grid-row:1/3}
.live b{color:#fff;font-weight:600}
.live span{color:var(--side-muted);font-size:.72rem}
.user{display:flex;align-items:center;gap:10px;border-top:1px solid var(--side-line);padding:12px 4px 0}
.avatar{width:34px;height:34px;border-radius:8px;background:#E3F3EC;color:#0C6B50;display:grid;place-items:center;font-weight:700;font-size:.78rem}
.user b{display:block;color:#fff;font-size:.84rem;font-weight:600}
.user span{font-size:.74rem;color:var(--side-muted)}
.user button{margin-left:auto;background:none;border:0;color:var(--side-muted);font-size:.72rem;text-decoration:underline;padding:4px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(16px,3.2vw,40px);border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.crumb{font-size:.86rem;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600}
.crumb i{font-style:normal;margin:0 8px;opacity:.6}
.tb-acts{display:flex;gap:8px;align-items:center}
.ib{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:grid;place-items:center;color:var(--muted);position:relative}
.ib .nd{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--bar-crit)}
.wrapm{min-width:0;display:flex;flex-direction:column}
main{padding-block:28px 60px;padding-inline:clamp(16px,3.2vw,40px);min-width:0;max-width:1240px;width:100%}
.eyebrow.date{color:var(--muted);font-weight:700}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.sample{font-size:.72rem;font-family:var(--f-mono);color:var(--muted);border:1px dashed var(--line);padding:3px 8px;border-radius:6px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:.86rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--tape);border-color:var(--tape);color:var(--on-tape)}
.btn.soft{background:var(--tape-soft);border-color:transparent;color:var(--tape)}
.btn.lg{padding:10px 16px}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.panel-h p{margin:2px 0 0;color:var(--muted);font-size:.84rem}
.grid{display:grid;gap:16px}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
@media (max-width:980px){.g-main{grid-template-columns:1fr}}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px 18px 15px;display:flex;flex-direction:column;gap:4px}
.kpi .kt{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kpi .tile{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:.85rem;font-weight:700}
.tile.g{background:var(--tape-soft);color:var(--tape)} .tile.b{background:var(--blue-soft);color:var(--blue)} .tile.a{background:var(--warn-soft);color:var(--warn)} .tile.v{background:var(--violet-soft);color:var(--violet)}
.delta{font-size:.72rem;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.delta.up{background:var(--tape-soft);color:var(--tape)} .delta.dn{background:var(--warn-soft);color:var(--warn)}
.kpi .eyebrow{text-transform:none;letter-spacing:0;font-size:.84rem;font-weight:500}
.kpi .v{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:.9rem;color:var(--muted);font-weight:500;margin-left:2px}
.kpi .s{font-size:.8rem;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:8px;white-space:nowrap}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.watch,.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.minor,.pill.info{background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.tape{background:var(--tape-soft);color:var(--tape)}

.stars{position:relative;display:inline-block;color:var(--line);letter-spacing:1px;font-size:.95rem;line-height:1}
.stars::before{content:"★★★★★"}
.stars::after{content:"★★★★★";position:absolute;inset:0 auto 0 0;width:var(--v);overflow:hidden;color:var(--star);white-space:nowrap}
.fc{display:inline-flex;align-items:center;gap:7px}
.fc b{font-family:var(--f-mono);font-weight:500;font-size:.92rem}

/* warnings */
.warn-list{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.wrow:first-child{border-top:0;padding-top:2px}
.wrow .dot{width:4px;align-self:stretch;border-radius:3px;min-height:36px}
.dot.crit{background:var(--bar-crit)} .dot.watch{background:var(--bar-warn)} .dot.ok{background:var(--ok)} .dot.info{background:var(--tape)}
.wrow .t{font-weight:600}
.wrow .m{font-size:.82rem;color:var(--muted)}
.wrow .fix{font-size:.82rem;margin-top:3px}
.wrow .fix b{color:var(--tape);font-weight:600}
.wrow .m b{color:var(--ink);font-weight:600}
.wrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.wrow.stack{grid-template-columns:auto minmax(0,1fr)}.wrow.stack .acts{grid-column:2;justify-content:flex-start;align-items:center}
.g-half{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}@media (max-width:980px){.g-half{grid-template-columns:1fr}}
@media (max-width:560px){.wrow{grid-template-columns:auto minmax(0,1fr)}.wrow .acts{grid-column:2;justify-content:flex-start}}

/* project rows */
.prow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.2fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.pname b{display:block;font-weight:600}
.pname span{font-size:.8rem;color:var(--muted)}
.gates{display:flex;gap:3px}
.gates i{flex:1;height:7px;border-radius:2px;background:var(--sunk)}
.gates i.pass{background:var(--ok)} .gates i.fail{background:var(--bar-crit)} .gates i.now{background:var(--blue)}
.gate-l{font-size:.75rem;color:var(--muted);margin-top:5px}
.driver{font-size:.78rem;color:var(--muted);margin-top:3px}
.why{grid-column:1/-1;background:var(--sunk);border-radius:8px;padding:10px 14px;font-size:.84rem}
.why table{width:100%;border-collapse:collapse}
.why td{padding:3px 0}
.why td:last-child{text-align:right;font-family:var(--f-mono)}
.neg{color:var(--crit)}
@media (max-width:720px){.prow{grid-template-columns:minmax(0,1fr) auto}.prow .gcol{grid-column:1/-1;order:3}.prow .fcol{order:2}}

/* feed */
.feed{display:flex;flex-direction:column;gap:12px}
.fi{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;font-size:.86rem}
.fi .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;font-weight:600}
.ic.ok{background:var(--ok-soft);color:var(--ok)} .ic.crit{background:var(--crit-soft);color:var(--crit)} .ic.watch{background:var(--warn-soft);color:var(--warn)} .ic.info{background:var(--tape-soft);color:var(--tape)}
.fi .when{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}

/* field check */
.check-wrap{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.check-wrap{grid-template-columns:1fr}}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 160px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;font-weight:400;color:var(--ink)}
.gate-tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:9px;flex-wrap:wrap}
.gate-tabs button{flex:1;border:0;background:none;border-radius:6px;padding:6px 8px;font-size:.82rem;font-weight:500;color:var(--muted)}
.gate-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.gate-tabs .st{font-size:.68rem;display:block}
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .lbl{font-size:.88rem}
.item .lbl small{display:block;color:var(--muted);font-size:.74rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:.78rem;font-weight:600;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"][data-v="pass"]{background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed="true"][data-v="fail"]{background:var(--crit-soft);color:var(--crit)}
.seg button[aria-pressed="true"][data-v="na"]{background:var(--sunk);color:var(--ink)}
.readings{display:flex;flex-direction:column;gap:10px;background:var(--sunk);border-radius:10px;padding:12px}
.rd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:end}
.rd .ins{display:flex;gap:8px;flex-wrap:wrap}
.rd .ins label{flex:1 1 110px}
.rd .unit{position:relative}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.photos img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.upl{border:1px dashed var(--muted);border-radius:8px;width:64px;height:64px;display:grid;place-items:center;font-size:.72rem;color:var(--muted);text-align:center;cursor:pointer}
.upl input{display:none}
.err{background:var(--crit-soft);color:var(--crit);border-radius:8px;padding:8px 12px;font-size:.84rem}
.result{border-radius:14px;padding:18px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:12px}
.result .big{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:1}
.rule-card{display:flex;flex-direction:column;gap:10px}
.rule-card li{margin-bottom:6px}
.rule-card ul{margin:0;padding-left:18px;font-size:.86rem}

/* issues board */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.8rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--tape);color:var(--on-tape);border-color:var(--tape)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.col{background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.88rem;padding:2px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card .tt{font-weight:600;font-size:.9rem}
.card .meta{font-size:.78rem;color:var(--muted)}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{font-size:.82rem;color:var(--muted);padding:10px 4px}

/* review gate */
.rv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
@media (max-width:420px){.rv-grid{grid-template-columns:1fr}}
.rv{display:flex;flex-direction:column;gap:12px}
.rv .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.conds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.conds li{display:flex;gap:8px;align-items:baseline}
.conds .mk{font-family:var(--f-mono);font-weight:600;width:14px;flex:none}
.mk.y{color:var(--ok)} .mk.n{color:var(--crit)}
.pulse{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem}
.pulse .pd{font-family:var(--f-mono);font-size:.74rem;border-radius:5px;padding:1px 6px;background:var(--sunk)}
.pd.lo{background:var(--crit-soft);color:var(--crit)} .pd.hi{background:var(--ok-soft);color:var(--ok)}
.rate{display:inline-flex;gap:2px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:28px;height:26px;font-family:var(--f-mono);font-size:.78rem}
.rate button:hover{border-color:var(--star);color:var(--star)}
.msg{width:100%;min-height:96px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:.84rem;resize:vertical}
.playbook{background:var(--crit-soft);border-radius:8px;padding:10px 12px;font-size:.84rem}
.playbook b{color:var(--crit)}
.playbook ol{margin:6px 0 0;padding-left:18px}

/* patterns */
.tbl-wrap{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:3px;width:100%;min-width:560px;font-size:.82rem}
.heat th{font-weight:600;color:var(--muted);text-align:left;padding:4px 6px;font-size:.76rem}
.heat td{text-align:center;border-radius:6px;padding:8px 4px;font-family:var(--f-mono)}
.heat td.l{text-align:left;font-family:var(--f-body);padding-left:6px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:120px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:.84rem}
.bar{height:10px;background:var(--sunk);border-radius:99px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.bar .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.ins-list{display:flex;flex-direction:column;gap:10px}

/* ---------- early-warning rules ---------- */
function warnings(){
  const out=[];
  const add=(p,key,sev,t,m,fix,act)=>{const id=p.id+':'+key;if(!p.handled.includes(id))out.push({id,p,sev,t,m,fix,act})};
  S.projects.forEach(p=>{
    if(p.stage>=4)return;
    const stageName=STAGES[p.stage];
    if(p.wx){
      if(p.stage>=1&&p.stage<=2&&p.wx.rainHrs<p.wx.cureHrs)
        add(p,'rain','critical',`Rain in ${p.wx.rainHrs}h, coating needs ${p.wx.cureHrs}h to cure`,`Exterior ${stageName.toLowerCase()} coat is scheduled today. Rain on uncured paint causes surfactant streaks and washout.`,'Move today\'s coat to after the rain window');
      if(p.wx.spread<5)
        add(p,'dew','watch',`Surface only ${p.wx.spread}°F above dew point at 7 AM`,'Coatings need at least 5°F spread or moisture condenses under the film.','Hold start until about 9:30 AM, then re-read');
      if(p.wx.low<50)
        add(p,'cold','watch',`Overnight low ${p.wx.low}°F, below the 50°F product minimum`,'Latex may not coalesce and will chalk early.','Switch to low-temp product or stop by 2 PM');
    }
    if(p.moisture.v!=null&&p.moisture.v>p.moisture.limit)
      add(p,'moist','critical',`Moisture ${p.moisture.v}% on substrate, limit ${p.moisture.limit}%`,'Painting over wet wood leads to peeling and blistering within months.','Hold paint, find the source, re-read in 24h');
    if(p.updateDays>=3)
      add(p,'comm','watch',`No client update in ${p.updateDays} days`,'Silence is the top predictor of a lower review, even when the work is fine.','Send a photo update today','update');
    const last=p.pulse[p.pulse.length-1];
    if(last!=null&&last<=3)
      add(p,'pulse','critical',`Client rated the last check-in ${last} of 5`,'Unhappy mid-project clients rarely leave 5 stars unless someone calls them.','PM calls the client today');
    const skipped=GATES.slice(0,Math.min(p.stage,4)).find(g=>p.gates[g]!=='pass'&&p.gates[g]!=='fail');
    if(skipped)
      add(p,'gate-'+skipped,'critical',`${stageName} work started without a passed ${skipped} check`,`Defects from ${skipped.toLowerCase()} get sealed under later coats and are expensive to fix.`,`Run a ${skipped} check now`,'check:'+skipped);
    openIssues(p.id).filter(i=>i.status==='open'&&ageH(i.at)>48).forEach(i=>
      add(p,'age'+i.id,'watch',`"${i.title}" open ${ageH(i.at)}h`,`${i.area}. Items open over 48h usually get noticed by the client first.`,`Escalate to ${crewOf(i.crew).lead}`,'issues'));
  });
  // crew patterns
  const since=Date.now()-30*DAY;
  Object.keys(S.crews).forEach(k=>{
    const counts={};
    S.issues.filter(i=>i.crew===k&&i.at>since).forEach(i=>counts[i.cat]=(counts[i.cat]||0)+1);
    Object.entries(counts).filter(([,n])=>n>=3).forEach(([cat,n])=>{
      const p=S.projects.find(x=>x.crew===k&&x.stage<4);
      if(p)add(p,'crew'+cat,'watch',`${crewOf(k).name} has ${n} ${cat.toLowerCase()} defects in 30 days`,`Repeat pattern on ${crewOf(k).lead}'s crew. Likely to show up on ${p.name}.`,`Lead walks the next ${cat==='Cut lines'?'ceiling line':cat.toLowerCase()+' task'} with them`,'patterns');
    });
  });
  const o={critical:0,watch:1};
  return out.sort((a,b)=>o[a.sev]-o[b.sev]);
}

/* ---------- 5-star forecast ---------- */
function forecast(p,W){
  W=W||warnings();
  const d=[];
  const iss=openIssues(p.id);
  ['critical','watch','minor'].forEach(sev=>{
    const open=iss.filter(i=>i.sev===sev&&i.status==='open').length;
    if(open)d.push({l:`${open} open ${sev} issue${open>1?'s':''}`,v:-SEV_PEN[sev]*open});
  });
  const fixed=iss.filter(i=>i.status==='fixed').length;
  if(fixed)d.push({l:`${fixed} fix${fixed>1?'es':''} not yet verified`,v:-.05*fixed});
  const pa=avg(p.pulse);
  if(p.pulse.length&&pa<4.5)d.push({l:`Client check-ins average ${pa.toFixed(1)}`,v:-(4.5-pa)*.6});
  if(p.updateDays>2)d.push({l:`${p.updateDays} days since last client update`,v:-Math.min(.4,.1*(p.updateDays-2))});
  if(p.slip)d.push({l:`${p.slip} day${p.slip>1?'s':''} behind schedule`,v:-Math.min(.4,.08*p.slip)});
  const pw=W.filter(w=>w.p.id===p.id&&!/^age/.test(w.id.split(':')[1]));
  const wc=pw.filter(w=>w.sev==='critical').length, ww=pw.length-wc;
  if(wc)d.push({l:`${wc} unhandled critical warning${wc>1?'s':''}`,v:-.15*wc});
  if(ww)d.push({l:`${ww} unhandled watch warning${ww>1?'s':''}`,v:-.05*ww});
  const score=Math.max(1,Math.min(5,5+d.reduce((s,x)=>s+x.v,0)));
  d.sort((a,b)=>a.v-b.v);
  return {score,d};
}

function firstPass(){let c=0,f=0;Object.values(S.crews).forEach(x=>{c+=x.checks;f+=x.fp});return c?f/c*100:0}

function gateBar(p){
  return `<div class="gates" title="Prep · Prime · Finish · Walkthrough">${GATES.map((g,i)=>{const s=p.gates[g];return `<i class="${s==='pass'?'pass':s==='fail'?'fail':i===p.stage?'now':''}"></i>`}).join('')}</div>`;

/* ---------- FIELD CHECK ---------- */
function nextGate(p){return GATES.find(g=>p.gates[g]!=='pass')||'Walkthrough'}
function readingsFor(p,g){
  const r=[];
  if(g==='Prep')r.push('moisture');
  if(g==='Finish')r.push('wft');
  if(p.kind==='Exterior'&&g!=='Walkthrough')r.push('dew');
  return r;
}
function newDraft(pid,gate){const p=proj(pid);UI.draft={pid,gate:gate||nextGate(p),marks:{},r:{moisture:'',surf:'',dew:'',wft:''},area:'',photos:[],err:''};UI.result=null}
function evalReading(p,k,r){
  if(k==='moisture'){const v=+r.moisture,l=p.moisture.limit;return{k,label:`Moisture ${v}% (limit ${l}%)`,pass:v<=l,fail:`Moisture ${v}% over the ${l}% limit`,sev:'critical',cat:'Moisture'}}
  if(k==='dew'){const s=+(r.surf-r.dew).toFixed(1);return{k,label:`Dew-point spread ${s}°F (need 5°F)`,pass:s>=5,fail:`Surface only ${s}°F above dew point`,sev:'critical',cat:'Conditions'}}
  if(k==='wft'){const v=+r.wft;return{k,label:`Wet film ${v} mils (target 4)`,pass:v>=4,fail:`Wet film ${v} mils, under the 4 mil target`,sev:'watch',cat:'Film build'}}
}
function readingPill(k){
  const d=UI.draft,p=proj(d.pid),r=d.r;
  const ready=k==='dew'?(r.surf!==''&&r.dew!==''):r[k]!=='';
  if(!ready)return `<span class="pill info">${tr('notTaken')}</span>`;
  const e=evalReading(p,k,r);
  return `<span class="pill ${e.pass?'ok':'crit'}">${e.pass?tr('inSpec'):tr('outSpec')}</span>`;
}

function submitCheck(){
  const d=UI.draft,p=proj(d.pid),items=CHECKLISTS[d.gate],rk=readingsFor(p,d.gate);
  const miss=items.filter(i=>!d.marks[i.id]).length;
  const missR=rk.filter(k=>k==='dew'?(d.r.surf===''||d.r.dew===''):d.r[k]==='');
  if(miss||missR.length){const parts=[];if(miss)parts.push(`${miss} checklist item${miss>1?'s':''} still unmarked`);if(missR.length)parts.push(`${missR.length} reading${missR.length>1?'s':''} missing`);d.err=UI.mode==='crew'?tr('missing').replace('{n}',miss+missR.length):parts.join(' and ')+'. Complete them to submit.';render();return}
  const before=forecast(p).score;
  const res=items.filter(i=>d.marks[i.id]!=='na').map(i=>({item:i.id,pass:d.marks[i.id]==='pass',fail:i.f,sev:i.sev,cat:i.cat}));
  rk.forEach(k=>res.push(evalReading(p,k,d.r)));
  const fails=res.filter(r=>!r.pass);
  const fp=res.length?Math.round((res.length-fails.length)/res.length*100):100;
  fails.forEach(f=>S.issues.push({id:S.nextId++,item:f.item,p:p.id,title:f.fail,area:d.area||d.gate+' check',cat:f.cat,sev:f.sev,crew:p.crew,status:'open',at:Date.now(),src:'Inspection'}));
  const gatePass=!fails.some(f=>f.sev!=='minor');
  p.gates[d.gate]=gatePass?'pass':'fail';
  const gi=GATES.indexOf(d.gate);
  if(gatePass&&p.stage<=gi)p.stage=gi+1;
  if(rk.includes('moisture'))p.moisture.v=+d.r.moisture;
  if(rk.includes('dew')&&p.wx)p.wx.spread=+(d.r.surf-d.r.dew).toFixed(1);
  const c=crewOf(p.crew);c.checks++;
  if(!fails.length)c.fp++;
  S.feed.unshift({k:gatePass?'ok':'crit',ic:gatePass?'✓':'!',t:`${d.gate} check ${gatePass?'passed':'failed'} · ${fp}% first pass`,s:`${p.name} · ${fails.length} issue${fails.length===1?'':'s'} created${UI.mode==='crew'?' · crew app, '+c.lead:''}`,at:Date.now()});
  save();
  UI.result={gate:d.gate,pname:p.name,area:d.area,fp,gatePass,fails,crew:c.name,before,after:forecast(p).score,photos:d.photos};
  UI.draft=null;render();window.scrollTo(0,0);
}

/* ---------- REVIEW GATE ---------- */
function reviewState(p,f){
  const open=openIssues(p.id).length, pa=avg(p.pulse), last=p.pulse[p.pulse.length-1]??0;
  const conds=[
    [p.gates.Walkthrough==='pass','Final walkthrough passed and client signed off'],
    [open===0,open===0?'No open or unverified issues':`${open} issue${open>1?'s':''} still open or unverified`],
    [pa>=4.5&&last>=4,`Client check-ins average ${pa.toFixed(1)}, latest ${last}`],
    [f.score>=4.7,`Forecast ${f.score.toFixed(2)} (needs 4.70)`]];
  const ok=conds.every(c=>c[0]);
  const status=p.reviewSent?'sent':ok?'ask':(f.score<4.3||last<=3)?'recover':'wait';
  return {conds,status};
}
function viewReview(){
  const W=warnings();

      <div class="top"><div><h3>${esc(p.name)}</h3><div class="muted" style="font-size:.8rem">${esc(p.client)} · ${p.stage>=4?'Closeout':STAGES[p.stage]}</div></div><span class="pill ${lbl[status][0]}">${lbl[status][1]}</span></div>
      <div>${starHTML(f.score)} <span class="muted" style="font-size:.78rem">forecast</span></div>
      <ul class="conds">${conds.map(([y,t])=>`<li><span class="mk ${y?'y':'n'}">${y?'✓':'✕'}</span><span>${esc(t)}</span></li>`).join('')}</ul>
      <div class="pulse"><span class="eyebrow">Client check-ins</span>${p.pulse.map(v=>`<span class="pd ${v<=3?'lo':v>=5?'hi':''}">${v}★</span>`).join('')}</div>
      ${!p.reviewSent?`<div class="pulse"><span class="muted">Log a 1-tap check-in reply:</span><span class="rate">${[1,2,3,4,5].map(n=>`<button data-act="pulse" data-p="${p.id}" data-v="${n}" aria-label="Client rated ${n} of 5">${n}</button>`).join('')}</span></div>`:''}
      ${status==='ask'?`<div>${UI.msg[p.id]?`<textarea class="msg" id="msg-${p.id}" aria-label="Review request message">${esc(msg)}</textarea><div class="row" style="margin-top:8px"><button class="btn sm" data-act="copy" data-p="${p.id}" style="flex:0 0 auto">Copy message</button><button class="btn sm primary" data-act="sent" data-p="${p.id}" style="flex:0 0 auto">Mark request sent</button></div>`:`<button class="btn primary" data-act="draft" data-p="${p.id}">Draft review request</button>`}</div>`:''}
      ${status==='recover'?`<div class="playbook"><b>Recovery plan</b><ol><li>PM calls ${esc(first)} today, listens, and names a fix date.</li><li>Close critical items first: ${openIssues(p.id).filter(i=>i.sev==='critical').map(i=>esc(i.title)).join('; ')||'none open'}.</li><li>Send before and after photos of each fix.</li><li>Run a new check-in after the fix. Ask for a review only when it's back to 5.</li></ol></div>`:''}

/* ---------- PATTERNS ---------- */
function viewPatterns(){
  const since=Date.now()-30*DAY;
  const recent=S.issues.filter(i=>i.at>since);
  const cats=[...new Set(recent.map(i=>i.cat))].sort((a,b)=>recent.filter(i=>i.cat===b).length-recent.filter(i=>i.cat===a).length);
  const ks=Object.keys(S.crews);
  const max=Math.max(1,...ks.flatMap(k=>cats.map(c=>recent.filter(i=>i.crew===k&&i.cat===c).length)));
  const cell=n=>{if(!n)return `<td style="background:var(--sunk);color:var(--muted)">·</td>`;const a=.18+.72*(n/max);return `<td style="background:color-mix(in srgb,var(--crit) ${Math.round(a*100)}%,var(--surface));color:${a>.55?'#fff':'var(--ink)'}">${n}</td>`};
  const insights=[];
  ks.forEach(k=>{const c=crewOf(k);const by={};recent.filter(i=>i.crew===k).forEach(i=>by[i.cat]=(by[i.cat]||0)+1);const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
    if(top&&top[1]>=3)insights.push({t:`${c.name} · ${top[1]} ${top[0].toLowerCase()} defects`,d:`${c.lead}'s crew. ${top[0]==='Cut lines'?'Pair the newest painter with the lead on the next two ceiling lines and switch to a 2-inch angled sash brush.':top[0]==='Touch-up'?'Halos come from touching up with a different applicator or old paint. Touch up with the same roller nap from the same batch, or repaint the full wall section.':top[0]==='Cleanliness'?'Add a 10-minute sweep and tape check before calling the walkthrough.':'Review the method on the next job start.'}`})});
  const tot=recent.length,topCat=cats[0];
  if(topCat)insights.push({t:`${topCat} is the top defect across all crews`,d:`${recent.filter(i=>i.cat===topCat).length} of ${tot} issues in the last 30 days. Add one targeted line to the toolbox talk this week.`});
  return `
  <div class="head"><div><div class="eyebrow">Quality insights</div><h1>Where defects come from</h1><p>Last 30 days of issues by crew and category. Repeat patterns feed the early-warning rules so the next job is checked for them first.</p></div><span class="sample">Sample data</span></div>
  <div class="grid g-main">
    <section class="panel"><div class="panel-h"><h2>Defects by crew and category</h2></div>
      <div class="tbl-wrap"><table class="heat"><thead><tr><th>Crew</th>${cats.map(c=>`<th>${esc(c)}</th>`).join('')}<th>Total</th></tr></thead>
      <tbody>${ks.map(k=>{const n=recent.filter(i=>i.crew===k).length;return `<tr><td class="l"><b>${crewOf(k).name}</b><br><span class="muted">${esc(crewOf(k).lead)}</span></td>${cats.map(c=>cell(recent.filter(i=>i.crew===k&&i.cat===c).length)).join('')}<td class="num"><b>${n}</b></td></tr>`}).join('')}</tbody></table></div>
    </section>
    <section class="panel"><div class="panel-h"><div><h2>First-pass rate</h2><p>Checks passed with zero fixes. Line marks the 90% target.</p></div></div>
      <div class="bars">${ks.map(k=>{const c=crewOf(k),v=c.fp/c.checks*100;return `<div class="bar-row"><span>${c.name}<br><span class="muted" style="font-size:.76rem">${c.checks} checks</span></span><div class="bar"><i style="width:${v}%;background:${v>=90?'var(--ok)':v>=80?'var(--warn)':'var(--crit)'}"></i><span class="tgt" style="left:90%"></span></div><b class="num">${v.toFixed(0)}%</b></div>`}).join('')}</div>
    </section>
  </div>
  <section class="panel" style="margin-top:16px"><div class="panel-h"><h2>Coaching suggestions</h2></div>
    <div class="ins-list">${insights.map(x=>`<div class="ins-item"><b>${esc(x.t)}</b><span class="muted">${esc(x.d)}</span></div>`).join('')}</div>

/* ---------- LOSS PREVENTION ---------- */
const REWORK={Overspray:420,'Cut lines':180,'Touch-up':120,Cleanliness:90,Finish:260,Masking:150,Moisture:900,Coverage:220,Color:1400,'Surface prep':240,Conditions:600,'Film build':200,Cure:500,Protection:300,Closeout:60};
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const LTYPE={order:['Mistake caught before it happened','tile g','✓'],purchase:['Purchase review','tile a','$'],time:['Time review','tile b','◷'],equip:['Equipment','tile v','⚒']};
function allFlags(){
  return [...S.loss.flags,...S.tools.filter(t=>Date.now()-t.last>5*DAY).map(t=>{
    const p=S.projects.find(x=>x.crew===t.crew&&x.stage<4)||S.projects[0],d=Math.floor((Date.now()-t.last)/DAY);
    return {id:'eq-'+t.id,type:'equip',p:p.id,sev:d>=8?'critical':'watch',t:`${t.name} #${t.id} not scanned in ${d} days`,m:`Assigned to ${S.crews[t.crew].name} (${S.crews[t.crew].lead}). Tools get scanned in the crew app at each job start.`,amt:t.value,fix:'Locate it and scan it today'}})];
}
function lossNumbers(){
  const L=S.loss,F=allFlags();
  const mats=L.materials.map(m=>{const used=m.bought-m.returned-m.left;const over=used-m.est;return{...m,used,over,pct:over/m.est*100,cost:Math.max(0,over)*m.price}});
  const matLoss=mats.reduce((a,m)=>a+m.cost,0);
  const st=id=>L.status[id]||'open';
  const openFlags=F.filter(f=>st(f.id)==='open'||st(f.id)==='asked');
  const atRisk=openFlags.filter(f=>f.type!=='order').reduce((a,f)=>a+f.amt,0);
  const prevented=F.filter(f=>f.type==='order'&&st(f.id)==='fixed').reduce((a,f)=>a+f.amt,0);
  const since=Date.now()-30*DAY;
  const rework=S.issues.filter(i=>i.at>since).reduce((a,i)=>a+(REWORK[i.cat]||150),0);
  const monthly=matLoss+F.filter(f=>f.type==='purchase'||f.type==='time').reduce((a,f)=>a+f.amt,0)*4+rework;
  return {mats,matLoss,openFlags,atRisk,prevented,rework,annual:monthly*12,st};
}
function viewLoss(){
  const N=lossNumbers(),L=S.loss;
  const stLbl={open:['warn','Needs review'],asked:['tape','Waiting on reply'],cleared:['ok','Cleared'],confirmed:['crit','Loss confirmed'],fixed:['ok','Fixed before it cost us']};
  const groups=['order','purchase','time','equip'];
  return `

    <div class="kpi"><div class="kt"><span class="tile g">✓</span><span class="delta up">saved</span></div><span class="eyebrow">Mistakes stopped early</span><span class="v">${money(N.prevented)}</span><span class="s">Rework cost last 30 days: ${money(N.rework)}</span></div>
  </div>
  <div class="grid">
    <section class="panel">

        <div class="warn-list">${list.map(f=>{const s=N.st(f.id),p=proj(f.p);const done=s==='cleared'||s==='confirmed'||s==='fixed';return `<div class="wrow stack" style="${done?'opacity:.6':''}"><span class="dot ${done?'ok':f.sev}"></span>
          <div><div class="t">${esc(f.t)}</div><div class="m"><b>${esc(p.name)}</b> · ${esc(f.m)}</div><div class="fix">${done?'':'Next step: <b>'+esc(f.fix)+'</b> · '}<span class="num">${money(f.amt)}</span> ${f.type==='order'?'if not caught':'at stake'}</div></div>
          <div class="acts"><span class="pill ${stLbl[s][0]}">${stLbl[s][1]}</span>${done?`<button class="btn sm" data-act="lossset" data-id="${f.id}" data-v="open">Undo</button>`:f.type==='order'?`<button class="btn sm primary" data-act="lossset" data-id="${f.id}" data-v="fixed">Mark fixed</button><button class="btn sm" data-act="lossset" data-id="${f.id}" data-v="cleared">Not an issue</button>`:`${s==='open'?`<button class="btn sm primary" data-act="lossset" data-id="${f.id}" data-v="asked">Ask crew lead</button>`:''}<button class="btn sm" data-act="lossset" data-id="${f.id}" data-v="cleared">Cleared</button><button class="btn sm" data-act="lossset" data-id="${f.id}" data-v="confirmed">Confirm loss</button>`}</div></div>`}).join('')}</div></div>`}).join('')}
    </section>

        <div class="tbl-wrap"><table class="heat" style="min-width:420px;border-spacing:0">
          <thead><tr><th>Project</th><th style="text-align:right">Est.</th><th style="text-align:right">Used</th><th style="text-align:right">Over</th><th style="text-align:right">Cost</th></tr></thead>
          <tbody>${N.mats.map(m=>`<tr style="border-top:1px solid var(--line)"><td class="l" style="border-top:1px solid var(--line);border-radius:0;padding:8px 6px"><b>${esc(proj(m.p).name)}</b><br><span class="muted" style="font-size:.76rem">${esc(m.product)}</span></td>
            <td style="text-align:right;border-top:1px solid var(--line);border-radius:0">${m.est} gal</td><td style="text-align:right;border-top:1px solid var(--line);border-radius:0">${m.used} gal</td>

            <td style="text-align:right;border-top:1px solid var(--line);border-radius:0">${m.cost?money(m.cost):'·'}</td></tr>`).join('')}</tbody></table></div>
      </section>
      <section class="panel rule-card">
        <h2>How it prevents loss</h2>
        <ul>
          <li><b>Order check:</b> every material order is matched to the signed color schedule and estimate before it ships. Wrong color, sheen, product or quantity gets stopped.</li>
          <li><b>Paint reconciliation:</b> leftover gallons get counted at Walkthrough, so every gallon is accounted for.</li>
          <li><b>Purchase rules:</b> flags buys outside crew hours, far from the job, not on the material list, or bought twice.</li>
          <li><b>Time vs. site:</b> compares timesheets with site check-ins. Gaps over 10% go to the PM.</li>
          <li><b>Tool check-out:</b> sprayers and sanders get scanned at each job start. Anything unscanned for 5 days is flagged.</li>
          <li><b>Rework cost:</b> every quality issue carries a typical fix cost, so you can see what mistakes cost each crew.</li>
        </ul>
      </section>
    </div>
  </div>`;
}

function clockTime(t){return new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
function crewAlerts(p,k){
  const es=UI.lang==='es',out=[],H=id=>p.handled.includes(p.id+':'+id);
  if(p.wx&&p.stage>=1&&p.stage<=2&&p.wx.rainHrs<p.wx.cureHrs&&!H('rain'))out.push(['crit',es?`Lluvia en ${p.wx.rainHrs}h. No empiecen capa exterior hoy. La pintura necesita ${p.wx.cureHrs}h para curar.`:`Rain in ${p.wx.rainHrs}h. Don't start an exterior coat today. Paint needs ${p.wx.cureHrs}h to cure.`]);
  if(p.wx&&p.wx.spread<5&&!H('dew'))out.push(['watch',es?`La superficie está solo ${p.wx.spread}°F sobre el punto de rocío. Esperen hasta las 9:30 AM y midan otra vez.`:`Surface is only ${p.wx.spread}°F above dew point. Wait until about 9:30 AM, then measure again.`]);
  if(p.moisture.v!=null&&p.moisture.v>p.moisture.limit&&!H('moist'))out.push(['crit',es?`Humedad ${p.moisture.v}% (límite ${p.moisture.limit}%). No pinten esa área hasta que esté seca.`:`Moisture ${p.moisture.v}% (limit ${p.moisture.limit}%). Don't paint that area until it's dry.`]);
  const sk=GATES.slice(0,Math.min(p.stage,4)).find(g=>p.gates[g]!=='pass'&&p.gates[g]!=='fail');
  if(sk&&!H('gate-'+sk))out.push(['crit',es?`Falta la inspección de ${GN.es[sk]}. Háganla antes de seguir.`:`The ${sk} inspection is missing. Do it before you continue.`]);
  const since=Date.now()-30*DAY,cnt={};S.issues.filter(i=>i.crew===k&&i.at>since).forEach(i=>cnt[i.cat]=(cnt[i.cat]||0)+1);
  Object.entries(cnt).filter(([,n])=>n>=3).forEach(([c,n])=>out.push(['watch',es?`Tu equipo tuvo ${n} arreglos de ${CAT_ES[c]||c.toLowerCase()} este mes. Cuidado extra hoy.`:`Your crew had ${n} ${c.toLowerCase()} fixes this month. Take extra care today.`]));
  return out;
}

  document.title=UI.mode==='crew'?'FieldPulse Crew':'FieldPulse';

}
function renderMgmt(){

  m.innerHTML={today:viewToday,check:viewCheck,issues:viewIssues,review:viewReview,patterns:viewPatterns,loss:viewLoss}[UI.view]();

function route(h){if(h==='crew')UI.mode='crew';else if(VIEWS.some(v=>v[0]===h)){UI.mode='mgmt';UI.view=h}else UI.mode='pick'}
function go(v){route(v);try{history.replaceState(null,'','#'+(v==='pick'?'start':v))}catch(e){}UI.draft=null;UI.result=null;render();window.scrollTo(0,0);const cs=$('#cscroll');if(cs)cs.scrollTop=0}
route((location.hash||'').slice(1));

document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-view]');if(nav){e.preventDefault();go(nav.dataset.view);return}
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.tagName==='A')e.preventDefault();
  const act=a.dataset.act, d=a.dataset;
  const issue=d.id&&S.issues.find(i=>i.id==d.id);
  switch(act){
    case 'why':UI.open[d.p]=!UI.open[d.p];render();break;
    case 'handle':{const pid=d.id.split(':')[0];proj(pid).handled.push(d.id);S.feed.unshift({k:'info',ic:'✓',t:'Warning handled',s:proj(pid).name,at:Date.now()});save();render();toast('Warning marked handled. Forecast updated.');break}
    case 'sendupdate':{const p=proj(d.p);p.updateDays=0;S.feed.unshift({k:'info',ic:'↗',t:'Photo update sent to client',s:p.name+' · Alex H.',at:Date.now()});save();render();toast('Client update logged.');break}
    case 'startnew':newDraft(S.projects.find(p=>p.stage<4)?.id||S.projects[0].id);go('check');break;
    case 'startcheck':newDraft(d.p,d.g);go('check');break;
    case 'newcheck':newDraft(S.projects.find(p=>p.stage<4)?.id||S.projects[0].id);render();break;
    case 'gate':UI.draft.gate=d.g;UI.draft.marks={};UI.draft.err='';render();break;
    case 'mark':UI.draft.marks[d.i]=d.v;UI.draft.err='';render();break;
    case 'allpass':CHECKLISTS[UI.draft.gate].forEach(i=>{if(!UI.draft.marks[i.id])UI.draft.marks[i.id]='pass'});render();break;
    case 'filter':UI.filter=d.p;render();break;
    case 'fixed':issue.status='fixed';S.feed.unshift({k:'watch',ic:'◷',t:`Fixed, awaiting verification: ${issue.title}`,s:proj(issue.p).name+' · '+crewOf(issue.crew).lead,at:Date.now()});save();render();toast('Moved to Fixed. A PM needs to verify it.');break;
    case 'verify':issue.status='verified';S.feed.unshift({k:'ok',ic:'✓',t:`Verified: ${issue.title}`,s:proj(issue.p).name+' · Alex H.',at:Date.now()});save();render();toast('Fix verified and closed.');break;
    case 'reopen':issue.status='open';issue.at=Date.now();save();render();toast('Issue reopened.');break;
    case 'pulse':{const p=proj(d.p),v=+d.v;p.pulse.push(v);S.feed.unshift({k:v<=3?'crit':v>=5?'ok':'watch',ic:'★',t:`Client check-in: ${v} of 5`,s:p.name+' · '+p.client,at:Date.now()});save();render();toast(`Check-in of ${v} logged.`);break}
    case 'draft':UI.msg[d.p]=true;render();break;
    case 'copy':{const ta=$('#msg-'+d.p);const done=()=>toast('Message copied.');try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();toast('Text selected. Press Ctrl+C or ⌘C to copy.')})}catch(err){ta.select();toast('Text selected. Press Ctrl+C or ⌘C to copy.')}break}
    case 'sent':{const p=proj(d.p);p.reviewSent=true;S.feed.unshift({k:'ok',ic:'★',t:'Review request logged as sent',s:p.name,at:Date.now()});save();render();toast('Logged as sent.');break}
    case 'mode':go(a.dataset.m==='crew'?'crew':a.dataset.m==='mgmt'?UI.view:'pick');break;
    case 'lang':UI.lang=d.v;try{localStorage.setItem('fp-lang',d.v)}catch(err){}if(UI.draft)UI.draft.err='';render();break;
    case 'setme':S.me=d.k||null;UI.ctab='today';UI.draft=null;UI.result=null;save();render();break;
    case 'ctab':UI.ctab=d.t;if(d.t!=='inspect')UI.result=null;render();$('#cscroll').scrollTop=0;break;
    case 'clock':{const k=S.me,p=activeProject(k),ci=S.clock[k]&&S.clock[k].in;S.clock[k]={in:ci?null:Date.now()};S.feed.unshift({k:'info',ic:'◷',t:`${crewOf(k).name} clocked ${ci?'out':'in'}${ci?' after '+((Date.now()-ci)/HOUR).toFixed(1)+' h':''}`,s:(p?p.name:'')+' · location matched the job site',at:Date.now()});save();render();toast(ci?'Clocked out.':'Clocked in.');break}
    case 'cfixed':issue.status='fixed';S.feed.unshift({k:'watch',ic:'◷',t:`Fixed in crew app, awaiting verification: ${issue.title}`,s:proj(issue.p).name+' · '+crewOf(issue.crew).lead+((UI.fixPhotos[issue.id]||[]).length?' · after photo attached':''),at:Date.now()});save();render();toast(UI.lang==='es'?'Enviado al PM para revisión.':'Sent to the PM to verify.');break;
    case 'scan':{const t=S.tools.find(x=>x.id===d.id);t.last=Date.now();S.feed.unshift({k:'ok',ic:'▤',t:`${t.name} #${t.id} scanned`,s:crewOf(t.crew).name+' · '+((activeProject(t.crew)||{}).name||''),at:Date.now()});save();render();toast(tr('scanned'));break}
    case 'lossset':{const f=allFlags().find(x=>x.id===d.id);if(d.v==='open')delete S.loss.status[d.id];else S.loss.status[d.id]=d.v;
      const msgs={asked:'Question sent to the crew lead (demo).',cleared:'Flag cleared.',confirmed:'Loss confirmed and logged for the owner.',fixed:'Marked fixed before it cost anything.',open:'Flag reopened.'};
      if(d.v!=='open')S.feed.unshift({k:d.v==='confirmed'?'crit':d.v==='asked'?'watch':'ok',ic:'$',t:`Loss flag ${({asked:'sent to crew lead',cleared:'cleared',confirmed:'confirmed',fixed:'fixed early'})[d.v]}: ${f.t}`,s:proj(f.p).name,at:Date.now()});
      save();render();toast(msgs[d.v]);break}
    case 'reset':S=seed();UI.fixPhotos={};UI.buy=null;UI.draft=null;UI.result=null;UI.open={};UI.msg={};UI.filter='all';save();render();toast('Demo data reset.');break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.dataset&&e.target.dataset.fixphoto){const id=e.target.dataset.fixphoto;UI.fixPhotos[id]=[...(UI.fixPhotos[id]||[]),...[...e.target.files].map(f=>URL.createObjectURL(f))];render();return}
  if(e.target.id==='by-photo'&&e.target.files[0]){UI.buy.photo=URL.createObjectURL(e.target.files[0]);UI.buy.err='';render();return}
  if(e.target.id==='f-proj'){newDraft(e.target.value);render()}
  if(e.target.id==='f-photo'){[...e.target.files].forEach(f=>UI.draft.photos.push(URL.createObjectURL(f)));render()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='by-what'&&UI.buy){UI.buy.what=e.target.value;return}
  if(e.target.id==='by-amt'&&UI.buy){UI.buy.amt=e.target.value;return}
  const d=UI.draft;if(!d)return;const id=e.target.id;
  if(id==='f-area')d.area=e.target.value;
  const m=id.match(/^r-(moisture|surf|dew|wft)$/);
  if(m){d.r[m[1]]=e.target.value;const k=m[1]==='surf'||m[1]==='dew'?'dew':m[1];const el=$('#p-'+k);if(el)el.innerHTML=readingPill(k)}
});
window.addEventListener('hashchange',()=>{route(location.hash.slice(1));render()});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{S=JSON.parse(e.newValue);render()}catch(err){}}});
document.addEventListener('submit',e=>{
  const id=e.target.id;
  if(id==='checkform'){e.preventDefault();submitCheck();const cs=$('#cscroll');if(cs&&UI.result)cs.scrollTop=0;return}
  if(id==='paintform'){e.preventDefault();const g=parseFloat($('#pt-gal').value),k=$('#pt-kind').value,p=activeProject(S.me),m=S.loss.materials.find(x=>x.p===p.id);if(!(g>=0))return;
    if(k==='received')m.bought+=g;else if(k==='returned')m.returned+=g;else m.left=g;
    S.feed.unshift({k:'info',ic:'▦',t:`Paint logged: ${g} gal ${k==='received'?'received':k==='returned'?'returned to store':'left over (count)'}`,s:p.name+' · '+crewOf(S.me).lead,at:Date.now()});save();render();toast(tr('saved'));return}
  if(id==='buyform'){e.preventDefault();const B=UI.buy,amt=parseFloat(B.amt);if(!B.photo||!B.what||!(amt>0)){B.err=!B.photo?tr('receiptNeed'):tr('missing').replace('{n}',(!B.what?1:0)+(!(amt>0)?1:0));render();return}
    const p=activeProject(S.me);S.loss.flags.push({id:'pu'+(S.nextId++),type:'purchase',p:p.id,sev:'watch',t:`${B.what}, ${money(amt)}`,m:`Logged in the crew app by ${crewOf(S.me).lead} with a receipt photo, during crew hours.`,amt,fix:'Approve if it matches the job'});
    S.feed.unshift({k:'info',ic:'$',t:`Purchase logged with receipt: ${money(amt)}`,s:p.name+' · '+crewOf(S.me).lead,at:Date.now()});UI.buy=null;save();render();toast(tr('saved'));}
});
render();
</script>

</body>
</html>
